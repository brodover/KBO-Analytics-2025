<div class="comparison-container">
  <div class="header">
    <h1>KBO Pitcher Movement Comparison</h1>
    <p>Select two teams and use the <strong>internal dropdowns</strong> to isolate specific pitchers.</p>
  </div>

  <div class="dual-layout">
    <div class="chart-column">
      <div class="selectors">
        <select [(ngModel)]="leftConfig.year" (change)="updateLeft()">
          <option *ngFor="let y of years" [value]="y">{{y}}</option>
        </select>
        <select [(ngModel)]="leftConfig.team" (change)="updateLeft()">
          <option *ngFor="let t of teams" [value]="t.code">{{t.name}}</option>
        </select>
      </div>
      <div class="viz-box">
        <div #chartLeft class="chart-container"></div>
      </div>
    </div>

    <div class="chart-column">
      <div class="selectors">
        <select [(ngModel)]="rightConfig.year" (change)="updateRight()">
          <option *ngFor="let y of years" [value]="y">{{y}}</option>
        </select>
        <select [(ngModel)]="rightConfig.team" (change)="updateRight()">
          <option *ngFor="let t of teams" [value]="t.code">{{t.name}}</option>
        </select>
      </div>
      <div class="viz-box">
        <div #chartRight class="chart-container"></div>
      </div>
    </div>
  </div>
</div>
